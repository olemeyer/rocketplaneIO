---
apiVersion: v1
kind: Secret
metadata:
  name: rocketplane-clickhouse
  namespace: rocketplane
type: Opaque
stringData:
  CLICKHOUSE_USER: rocketplane
  CLICKHOUSE_PASSWORD: "__CH_PASS__"
  CLICKHOUSE_DB: otel
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: rocketplane
spec:
  selector: { app: clickhouse }
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: rocketplane
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels: { app: clickhouse }
  template:
    metadata:
      labels: { app: clickhouse }
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: clickhouse
          # Pin an exact patch — do NOT float on :24.12. The 24.12.6.70 build ships a
          # broken executable checksum (Code 246 CORRUPTED_DATA on startup, CrashLoop);
          # a floating tag silently drifted onto it. Bump deliberately after verifying.
          image: clickhouse/clickhouse-server:24.12.3.47@sha256:3fb2bd1a2fa9e095a1844b2b559eb580795773cf459a994f53be86e7ec999704
          env:
            - name: CLICKHOUSE_USER
              valueFrom: { secretKeyRef: { name: rocketplane-clickhouse, key: CLICKHOUSE_USER } }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: rocketplane-clickhouse, key: CLICKHOUSE_PASSWORD } }
            - name: CLICKHOUSE_DB
              valueFrom: { secretKeyRef: { name: rocketplane-clickhouse, key: CLICKHOUSE_DB } }
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          ports:
            - { name: http, containerPort: 8123 }
            - { name: native, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /ping, port: 8123 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /ping, port: 8123 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "" # ANPASSEN: eure SSD-StorageClass (leer = Default-Class)
        resources:
          requests:
            storage: 20Gi

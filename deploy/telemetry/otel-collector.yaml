---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: rocketplane
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    processors:
      batch:
        timeout: 5s
        send_batch_size: 10000
      # Rausch-Filter (~30% aller Spans): (a) Beyla-synthetische Internal-Phasen
      # "in queue"/"processing" (reine Span-Verdreifachung, Queue-Zeit signalfrei:
      # p99 0,1ms), (b) ERFOLGREICHE kubelet-Health-Checks. Fehlgeschlagene
      # Health-Checks (>=500) bleiben erhalten; error_mode ignore = fail-open
      # (bei OTTL-Auswertungsfehler wird der Span behalten, nie still gedroppt).
      filter/noise:
        error_mode: ignore
        traces:
          span:
            - 'kind == SPAN_KIND_INTERNAL and (name == "in queue" or name == "processing")'
            - 'kind == SPAN_KIND_SERVER and IsMatch(attributes["url.path"], "^/(health|healthz|ready|readyz|live|livez|alive|ping|health/ready|health/live)$") and attributes["http.response.status_code"] != nil and Int(attributes["http.response.status_code"]) < 500'

    exporters:
      debug:
        verbosity: normal
      clickhouse:
        endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4
        database: ${env:CLICKHOUSE_DB}
        username: ${env:CLICKHOUSE_USER}
        password: ${env:CLICKHOUSE_PASSWORD}
        create_schema: true
        ttl: 72h
        logs_table_name: otel_logs
        traces_table_name: otel_traces
        metrics_table_name: otel_metrics
        timeout: 10s
        retry_on_failure:
          enabled: true

    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [filter/noise, batch]
          exporters: [clickhouse, debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [clickhouse, debug]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: rocketplane
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: rocketplane
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.116.1@sha256:d0ebf65280da2e1b1491d1b93648281afd353d4b9ea19160090303cec9a233bd
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: CLICKHOUSE_USER
              valueFrom: { secretKeyRef: { name: rocketplane-clickhouse, key: CLICKHOUSE_USER } }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: rocketplane-clickhouse, key: CLICKHOUSE_PASSWORD } }
            - name: CLICKHOUSE_DB
              valueFrom: { secretKeyRef: { name: rocketplane-clickhouse, key: CLICKHOUSE_DB } }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe:
            httpGet: { path: /, port: 13133 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: otel-collector-config

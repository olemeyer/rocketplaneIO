# Default values for rocketplane-agent.
# The three connection values below are normally injected by the install command
# that the rocketplane UI generates for you ("Connect cluster").

# -- Base URL of the rocketplane control-plane (e.g. https://app.rocketplane.io).
# The agent only ever talks OUTBOUND to this URL. Required. Maps to
# RP_CONTROLPLANE_URL.
controlplane:
  url: ""

# -- One-time enroll token (format: rpe_<64 hex chars>) issued by the control-plane
# when you connect a cluster. Stored in a Secret and exchanged once for a long-lived
# agent token. Required. Maps to RP_ENROLL_TOKEN (via secretKeyRef).
enrollToken: ""

# -- Human-friendly cluster name shown in the rocketplane UI. Maps to
# RP_CLUSTER_NAME.
clusterName: ""

image:
  repository: ghcr.io/olemeyer/rocketplaneio/agent
  # Pin to a released version — never float on `edge`. Bump on upgrade.
  tag: "0.7.13"
  pullPolicy: IfNotPresent

# -- Optional image pull secrets for private registries.
imagePullSecrets: []

# The agent is a watcher, but its informer cache holds every pod, service and
# workload in the cluster — so memory scales with cluster size, not with load.
# 128Mi OOM-killed the agent in a crashloop on a 63-namespace / 672-pod cluster,
# and the only symptom in the UI was a cluster that stayed empty. These defaults
# cover a few thousand pods; raise memory further for anything larger.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  # -- Create the ServiceAccount. Disable to reuse an existing one.
  create: true
  # -- Name of the ServiceAccount used by the agent pod.
  name: rocketplane-agent
  # -- Extra annotations for the ServiceAccount (e.g. IRSA / Workload Identity).
  annotations: {}

rbac:
  # -- Create the enumerated ClusterRole + binding. Disable if RBAC is managed
  # out-of-band.
  create: true
  # -- Grant the broad ACT access the generic operation set needs (any kind
  # incl. CRDs, exec, evictions). Guardrails are enforced by the control plane
  # (transactions, classification, approvals, rollback). false = observe-only.
  actions: true

# -- Number of agent replicas. A Kubernetes Lease elects exactly ONE leader that
# syncs and executes actions; extra replicas are hot standbys for fast failover.
# 1 is fine for most clusters (Kubernetes restarts the pod quickly anyway);
# set 2 for HA.
replicaCount: 1

# Container-log collection. A SEPARATE DaemonSet (one pod per node) tails the
# node-local container logs under /var/log/pods read-only and ships them to the
# control-plane. It runs with RP_AGENT_ROLE=logs (logs only — no topology/actions),
# so the single-writer Deployment above stays the only writer. It needs no conntrack
# privileges (no hostNetwork/NET_ADMIN), only the read-only host mount.
logs:
  # -- Deploy the node-local log-collector DaemonSet. Without it the UI shows no
  # container logs (the single Deployment can only see its own node and does not
  # mount host logs).
  enabled: true
  # -- Also mount /var/lib/docker/containers, where /var/log/pods symlinks point
  # on the Docker runtime (e.g. minikube's docker driver). On containerd the dir
  # is created empty and unused (real files live under /var/log/pods), so it is
  # safe to leave on everywhere — hence it defaults to true: logs "just work"
  # without the caller knowing the node runtime. Set false for strict clusters
  # that forbid the extra hostPath.
  dockerContainers: true
  # -- Resources for each log-collector pod. Slim — it tails files and ships batches.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

# Grafana Beyla — eBPF auto-instrumentation. A SEPARATE, PRIVILEGED DaemonSet
# (one pod per node) that attaches eBPF probes to node processes to emit L7
# traces (HTTP/gRPC/SQL/Redis) and L4 network flows as OTLP — no code changes in
# your apps. It powers the service map and the distributed traces in the UI.
#
# WARNING — this is heavy and privileged, unlike the rest of this chart:
#   - runs with securityContext.privileged: true (root, full host access),
#   - hostPID + hostNetwork (must see all node PIDs and the host net namespace),
#   - tolerates every taint (runs on every node, control-plane nodes included).
# It is far more invasive than the read-only agent. Disable it (beyla.enabled:
# false) if your cluster policy forbids privileged/hostPID/hostNetwork pods.
beyla:
  # -- Deploy the privileged Beyla eBPF DaemonSet. Without it the UI has no
  # auto-instrumented traces / service map from this cluster. Off => no Beyla
  # objects are rendered at all (SA, RBAC and DaemonSet are all gated on this).
  enabled: true
  image:
    # -- Beyla image repository.
    repository: grafana/beyla
    # -- Beyla image tag, pinned by digest — eBPF programs are kernel/version-
    # sensitive, and a floating minor must never drift a probe onto every node.
    tag: "2.2@sha256:9ad8e1c88fe6ce5a429763d1fc068997ecacc7e124147556fde9ae6430717e37"
    # -- Beyla image pull policy.
    pullPolicy: IfNotPresent
  # -- Ports Beyla instruments (BEYLA_OPEN_PORT). Common HTTP/gRPC app ports plus
  # DB ports (Beyla parses SQL/Redis/Mongo to draw app<->db edges in the map).
  openPorts: "80,443,3000,3001,4173,5000,5678,8000,8080,8090,8443,9000,3306,5432,6379,27017"
  # -- OTLP endpoint Beyla exports to (OTEL_EXPORTER_OTLP_ENDPOINT). Defaults to
  # the in-cluster collector Service. Override to point at your own collector,
  # e.g. --set beyla.otlpEndpoint=http://my-collector.observability:4318 .
  otlpEndpoint: "http://otel-collector:4318"
  # -- eBPF trace-context propagation mode (BEYLA_BPF_CONTEXT_PROPAGATION).
  # "headers" = clean W3C traceparent chaining (real distributed traces). Avoid
  # "all" — its IP/connection heuristic merges unrelated keep-alive requests into
  # one trace (bogus waterfalls).
  contextPropagation: headers
  # -- How often Beyla flushes metrics (BEYLA_METRICS_INTERVAL).
  metricsInterval: 15s
  # -- Cluster name stamped onto every Beyla signal (BEYLA_KUBE_CLUSTER_NAME).
  # Empty => falls back to the top-level `.Values.clusterName`. Set only to give
  # Beyla a different cluster identity than the agent.
  clusterName: ""
  # -- Resources for each Beyla pod. Heavier than the agent — eBPF processing.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 800m
      memory: 1Gi

# -- Pod-level annotations.
podAnnotations: {}

# -- Pod-level labels.
podLabels: {}

# Harden the runtime — the agent needs no privileges and no writable root fs.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Node selector for the agent pod.
nodeSelector: {}

# -- Tolerations for the agent pod.
tolerations: []

# -- Affinity rules for the agent pod.
affinity: {}

{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rocketplane-agent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rocketplane-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The agent talks outbound-only to the control-plane; no token is needed by the
# API server for that. We still mount the SA token so client-go's in-cluster
# config can authenticate to the local kube-apiserver for the read-only watch.
automountServiceAccountToken: true
{{- end }}

{{- if .Values.enrollToken -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rocketplane-agent.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rocketplane-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  # One-time enroll token (rpe_...). Consumed once by the control-plane during
  # enroll and swapped for a long-lived agent token held in memory by the pod.
  enroll-token: {{ .Values.enrollToken | quote }}
{{- end }}

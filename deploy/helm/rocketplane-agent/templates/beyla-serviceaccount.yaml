{{- if .Values.beyla.enabled }}
# Dedicated ServiceAccount for the Beyla DaemonSet. Kept separate from the agent
# SA because Beyla needs its own (broader) Kubernetes metadata read access and is
# a privileged workload — its RBAC surface should not leak into the agent's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rocketplane-agent.fullname" . }}-beyla
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rocketplane-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: beyla
{{- end }}

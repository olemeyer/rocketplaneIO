{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rocketplane-agent.fullname" . }}
  labels:
    {{- include "rocketplane-agent.labels" . | nindent 4 }}
# Enumerated ClusterRole — every verb the agent holds, nothing more.
# No cluster-admin, no wildcard. Secrets: the inventory sync reads METADATA
# only (type + key count — enforced in agent code, agent/internal/sync/inventory.go);
# delete the secrets entry below for a zero-secrets-RBAC install — the agent
# degrades gracefully (that kind is simply skipped).
#
# OBSERVE rules (read-only) are always granted — topology sync, the service map,
# the resource inventory, triage events and kubelet stats.
# ACT rules (the write verbs the safe-action catalog needs) are gated behind
# `rbac.actions` — set it to false for a strictly observe-only agent.
rules:
  # ── OBSERVE (read-only) ──
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "nodes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # Inventory (Resources page + copilot list_resources). Optional — safe to remove.
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "serviceaccounts", "resourcequotas", "limitranges", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  # debug_bundle / pod_events: triage events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # kubelet stats/summary via API-server proxy (node/volume utilization)
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.rbac.actions }}
  # ── ACT (safe actions) ──
  # scale/restart/set-image/set-env/set-resources/rollout-*/partition = patch controllers
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["patch"]
  # delete_pod / cleanup_pods; annotate a pod = patch
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "patch"]
  # cordon/uncordon/taint/set-label-on-node = patch node; drain = PDB-respecting evictions
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # hpa_set / hpa_toggle
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["patch"]
  # cronjob_suspend/resume/trigger + cleanup_jobs
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete"]
  # patch_configmap; set_label/annotate on namespace; annotate on service/PVC/PDB
  - apiGroups: [""]
    resources: ["configmaps", "namespaces", "services", "persistentvolumeclaims"]
    verbs: ["patch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["patch"]
  {{- end }}
{{- end }}

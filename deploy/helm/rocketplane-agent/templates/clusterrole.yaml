{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rocketplane-agent.fullname" . }}
  labels:
    {{- include "rocketplane-agent.labels" . | nindent 4 }}
# Enumerated ClusterRole — every verb the agent holds, nothing more.
# No cluster-admin, no wildcard. Secrets: the inventory sync reads METADATA
# only (type + key count — enforced in agent code, agent/internal/sync/inventory.go);
# delete the secrets entry below for a zero-secrets-RBAC install — the agent
# degrades gracefully (that kind is simply skipped).
#
# OBSERVE rules (read-only) are always granted — topology sync, the service map,
# the resource inventory, triage events and kubelet stats.
# ACT rules (the write verbs the safe-action catalog needs) are gated behind
# `rbac.actions` — set it to false for a strictly observe-only agent.
rules:
  # ── OBSERVE (read-only) ──
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "nodes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # Inventory (Resources page + copilot list_resources). Optional — safe to remove.
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "serviceaccounts", "resourcequotas", "limitranges", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  # debug_bundle / pod_events: triage events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # kubelet stats/summary via API-server proxy (node/volume utilization)
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  # HA leader election: with replicas>1 exactly one agent syncs and acts;
  # the leader is chosen via a Lease in the agent's namespace.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  {{- if .Values.rbac.actions }}
  # ── ACT (generic operation set) ──
  # Broad by design: external AI agents operate through kubectl-shaped
  # primitives (get/list/patch/apply/delete/exec) on ANY kind incl. CRDs. The
  # control plane enforces the guardrails: transaction requirement, risk
  # classification, human approval for hard operations, durable snapshot
  # rollback and a full audit trail. Set rbac.actions=false for observe-only.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  {{- end }}
{{- end }}

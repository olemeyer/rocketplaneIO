apiVersion: v2
name: rocketplane-agent
description: >-
  rocketplane in-cluster agent. Runs a single read-only pod that enrolls with the
  rocketplane control-plane (outbound-only), reports the cluster identity
  (kube-system namespace UID) and continuously syncs namespaces. The control-plane
  never initiates connections into the cluster.
type: application
# Chart version — bump on any change to the chart itself.
version: 0.2.0
# appVersion tracks the rocketplane-agent binary; surfaced to the control-plane
# as RP_AGENT_VERSION and stored on the cluster row.
appVersion: "0.1.0"
kubeVersion: ">=1.22.0-0"
home: https://github.com/rocketplaneio/rocketplane
sources:
  - https://github.com/rocketplaneio/rocketplane
keywords:
  - rocketplane
  - observability
  - kubernetes
  - agent
maintainers:
  - name: rocketplaneIO

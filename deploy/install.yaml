# rocketplane-agent — plain kubectl install (Helm-free variant)
# ---------------------------------------------------------------------------
# Prefer the Helm install command shown in the rocketplane UI. Use this file
# when Helm is not available.
#
# Two placeholders must be replaced before applying:
#   REPLACE_ME_CONTROLPLANE_URL  -> your control-plane URL, e.g. https://app.rocketplane.io
#   REPLACE_ME_ENROLL_TOKEN      -> the one-time enroll token (rpe_...) from the UI
#
# Then:
#   kubectl apply -f install.yaml
#
# The agent connects OUTBOUND only. Its RBAC is split into two blocks below:
# OBSERVE (read-only sync) and ACT (broad write access for the generic
# operation set — arbitrary kinds incl. CRDs). The guardrails live in the
# control plane, not in this file: every mutation requires an MCP transaction,
# is risk-classified, may require human approval, is snapshotted before it
# commits and rolls back on cancel/expiry — fully audited. Delete the ACT
# block to run a strictly observe-only agent.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: rocketplane
  labels:
    app.kubernetes.io/part-of: rocketplane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rocketplane-agent
  namespace: rocketplane
  labels:
    app.kubernetes.io/name: rocketplane-agent
    app.kubernetes.io/part-of: rocketplane
automountServiceAccountToken: true
---
# ClusterRole — OBSERVE is enumerated read-only; ACT grants the broad write
# access the generic operation set needs (any kind, incl. CRDs). Safety is
# enforced upstream: transaction requirement, risk classification, approval
# gate, durable snapshot rollback, full audit trail.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rocketplane-agent
  labels:
    app.kubernetes.io/name: rocketplane-agent
    app.kubernetes.io/part-of: rocketplane
rules:
  # ── OBSERVE (read-only) ──
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "nodes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # Inventory (Resources page + copilot list_resources). Secrets = metadata only
  # (enforced in agent code); remove any line here and the agent degrades gracefully.
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "serviceaccounts", "resourcequotas", "limitranges", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  # HA leader election: with replicas>1 exactly one agent syncs and acts.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  # ── ACT (generic operation set) ──
  # Broad by design: external AI agents operate through kubectl-shaped
  # primitives (get/list/patch/apply/delete/exec) on ANY kind incl. CRDs.
  # The control plane classifies each operation, gates hard ones behind human
  # approval, captures the before-state durably and rolls back on
  # cancel/expiry. Delete this block for an observe-only agent.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rocketplane-agent
  labels:
    app.kubernetes.io/name: rocketplane-agent
    app.kubernetes.io/part-of: rocketplane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rocketplane-agent
subjects:
  - kind: ServiceAccount
    name: rocketplane-agent
    namespace: rocketplane
---
apiVersion: v1
kind: Secret
metadata:
  name: rocketplane-agent-enroll
  namespace: rocketplane
  labels:
    app.kubernetes.io/name: rocketplane-agent
    app.kubernetes.io/part-of: rocketplane
type: Opaque
stringData:
  # >>> REPLACE_ME_ENROLL_TOKEN <<< one-time enroll token (rpe_...) from the UI.
  enroll-token: "REPLACE_ME_ENROLL_TOKEN"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketplane-agent
  namespace: rocketplane
  labels:
    app.kubernetes.io/name: rocketplane-agent
    app.kubernetes.io/part-of: rocketplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rocketplane-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rocketplane-agent
        app.kubernetes.io/part-of: rocketplane
    spec:
      serviceAccountName: rocketplane-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/olemeyer/rocketplaneio/agent:0.7.13
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # >>> REPLACE_ME_CONTROLPLANE_URL <<< e.g. https://app.rocketplane.io
            - name: RP_CONTROLPLANE_URL
              value: "REPLACE_ME_CONTROLPLANE_URL"
            - name: RP_ENROLL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rocketplane-agent-enroll
                  key: enroll-token
            - name: RP_CLUSTER_NAME
              value: ""
            - name: RP_AGENT_VERSION
              value: "0.1.0"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # No probes: the agent exposes no HTTP server and runs on a distroless
          # image. On enroll/sync failure it exits non-zero and is restarted.
---
# Node-local log collector — one lightweight pod per node (RP_AGENT_ROLE=logs)
# tails the container logs under /var/log/pods read-only and ships them OUTBOUND.
# The agent Deployment above is a single pod and cannot see every node's logs, so
# without this DaemonSet the Logs view stays empty. Delete it to disable log
# collection.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rocketplane-agent-logs
  namespace: rocketplane
  labels:
    app.kubernetes.io/name: rocketplane-agent
    app.kubernetes.io/component: logs
    app.kubernetes.io/part-of: rocketplane
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rocketplane-agent
      app.kubernetes.io/component: logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rocketplane-agent
        app.kubernetes.io/component: logs
        app.kubernetes.io/part-of: rocketplane
    spec:
      serviceAccountName: rocketplane-agent
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: ghcr.io/olemeyer/rocketplaneio/agent:0.7.13
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: RP_AGENT_ROLE
              value: "logs"
            # >>> REPLACE_ME_CONTROLPLANE_URL <<< same value as the agent above.
            - name: RP_CONTROLPLANE_URL
              value: "REPLACE_ME_CONTROLPLANE_URL"
            - name: RP_ENROLL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rocketplane-agent-enroll
                  key: enroll-token
            - name: RP_CLUSTER_NAME
              value: ""
            - name: RP_AGENT_VERSION
              value: "0.1.0"
          # containerd/CRI keep the real files under /var/log/pods;
          # /var/lib/docker/containers covers the Docker-runtime symlinks (minikube).
          volumeMounts:
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
            # DirectoryOrCreate → safe on containerd nodes where the dir is absent
            # (created empty, unused); on the docker runtime it holds the real logs.
            type: DirectoryOrCreate
---
# Beyla — eBPF auto-instrumentation (L7 traces + L4 network flows → the service
# map and RED metrics, no code changes). Privileged + host-level, like every
# eBPF monitor. Delete this block for an agent-only install. It exports OTLP to
# an in-cluster collector Service at otel-collector:4318 — deploy one alongside,
# or edit OTEL_EXPORTER_OTLP_ENDPOINT below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rocketplane-beyla
  namespace: rocketplane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rocketplane-beyla
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rocketplane-beyla
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rocketplane-beyla
subjects:
  - kind: ServiceAccount
    name: rocketplane-beyla
    namespace: rocketplane
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rocketplane-beyla
  namespace: rocketplane
  labels:
    app.kubernetes.io/name: rocketplane-beyla
    app.kubernetes.io/part-of: rocketplane
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rocketplane-beyla
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rocketplane-beyla
        app.kubernetes.io/part-of: rocketplane
    spec:
      serviceAccountName: rocketplane-beyla
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: beyla
          image: grafana/beyla:2.2@sha256:9ad8e1c88fe6ce5a429763d1fc068997ecacc7e124147556fde9ae6430717e37
          securityContext:
            privileged: true
          env:
            - name: BEYLA_OPEN_PORT
              # No 9000: instrumented ClickHouse fails its own executable
              # checksum (Code: 246) on its next restart.
              value: "80,443,3000,3001,4173,5000,5678,8000,8080,8090,8443,3306,5432,6379,27017"
            - name: BEYLA_SKIP_GO_SPECIFIC_TRACERS
              value: "true"
            - name: BEYLA_KUBE_METADATA_ENABLE
              value: "true"
            - name: BEYLA_NETWORK_METRICS
              value: "true"
            - name: BEYLA_OTEL_METRICS_FEATURES
              value: "application,network"
            - name: BEYLA_KUBE_CLUSTER_NAME
              value: ""
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: BEYLA_METRICS_INTERVAL
              value: "15s"
            - name: BEYLA_BPF_CONTEXT_PROPAGATION
              value: "headers"
            - name: BEYLA_BPF_TRACK_REQUEST_HEADERS
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 1Gi

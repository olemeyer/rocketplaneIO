receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 10000

exporters:
  debug:
    verbosity: normal
  # Schreibt Telemetrie OTel-nativ nach ClickHouse (Schema wird bei Bedarf angelegt).
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4
    database: ${env:CLICKHOUSE_DB}
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: true
    ttl: 72h
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_table_name: otel_metrics
    timeout: 10s
    retry_on_failure:
      enabled: true

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse, debug]
    # KEINE logs-Pipeline: die Control-Plane besitzt otel_logs (eigenes Schema mit
    # ClusterId + Workload-Spalten) und füllt sie mit den Agent-Container-Logs.
    # Würde der Collector otel_logs anlegen, gewänne sein Standard-OTel-Schema den
    # Race und die CP-Log-Query bräche an der fehlenden ClusterId-Spalte.

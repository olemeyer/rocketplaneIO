# platform.yml — builds the self-hosting images of the platform itself:
#
#   ghcr.io/olemeyer/rocketplaneio/controlplane   (Go, single static binary)
#   ghcr.io/olemeyer/rocketplaneio/web            (Next.js standalone)
#
# Tag strategy mirrors the agent workflow: :edge + :sha-<short> on main,
# :<semver> + :latest on v* tags. PRs touching the platform build without push.
# deploy/compose/docker-compose.prod.yml consumes these images.
name: platform

on:
  push:
    branches: [main]
    paths:
      - 'services/controlplane/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/platform.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'services/controlplane/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/platform.yml'
  workflow_dispatch:

permissions:
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: controlplane
            dockerfile: services/controlplane/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rocketplaneio/${{ matrix.name }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('edge-{0}', github.sha) }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

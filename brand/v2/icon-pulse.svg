<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aurora" x1="40" y1="24" x2="472" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="hl" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 110) rotate(48) scale(440)">
      <stop stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#04121a" flood-opacity="0.28"/>
    </filter>
    <filter id="lineGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#aurora)"/>
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#hl)"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="117.25" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- rocket, angehoben ueber die Live-Metrik -->
  <g filter="url(#soft)" transform="translate(256 232) scale(0.76) translate(-256 -256)">
    <path d="M198 292 L150 366 L198 348 Z" fill="#ffffff" fill-opacity="0.92"/>
    <path d="M314 292 L362 366 L314 348 Z" fill="#ffffff" fill-opacity="0.92"/>
    <path d="M232 356 C 240 402 272 402 280 356 Z" fill="#ffffff" fill-opacity="0.55"/>
    <path fill-rule="evenodd" clip-rule="evenodd" fill="#ffffff"
      d="M256 100 C 302 150 314 216 314 288 C 314 322 308 344 298 356 L 214 356 C 204 344 198 322 198 288 C 198 216 210 150 256 100 Z
         M226 196 a30 30 0 1 0 60 0 a30 30 0 1 0 -60 0 Z"/>
  </g>

  <!-- live telemetry pulse (heartbeat) the rocket rides on -->
  <g filter="url(#lineGlow)">
    <path d="M104 404 L196 404 L220 404 L236 380 L250 404 L262 352 L276 404 L290 388 L304 404 L408 404"
          stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="140" cy="404" r="7" fill="#ffffff"/>
    <circle cx="372" cy="404" r="7" fill="#ffffff"/>
  </g>
</svg>

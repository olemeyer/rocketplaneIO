<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aurora" x1="40" y1="24" x2="472" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="hl" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 110) rotate(48) scale(440)">
      <stop stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#04121a" flood-opacity="0.28"/>
    </filter>
    <filter id="blip" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#aurora)"/>
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#hl)"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="117.25" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- monitoring orbit: gepunktet = Telemetrie-Sampling, + getrackter Daten-Blip -->
  <g transform="rotate(-22 256 262)">
    <ellipse cx="256" cy="262" rx="198" ry="94" stroke="#ffffff" stroke-opacity="0.6" stroke-width="9"
             fill="none" stroke-dasharray="1.5 28" stroke-linecap="round"/>
    <circle cx="454" cy="262" r="16" fill="#ffffff" filter="url(#blip)"/>
  </g>

  <g filter="url(#soft)" transform="translate(256 262) scale(0.78) translate(-256 -262)">
    <path d="M198 298 L150 372 L198 354 Z" fill="#ffffff" fill-opacity="0.92"/>
    <path d="M314 298 L362 372 L314 354 Z" fill="#ffffff" fill-opacity="0.92"/>
    <path d="M232 362 C 240 408 272 408 280 362 Z" fill="#ffffff" fill-opacity="0.55"/>
    <path fill-rule="evenodd" clip-rule="evenodd" fill="#ffffff"
      d="M256 106 C 302 156 314 222 314 294 C 314 328 308 350 298 362 L 214 362 C 204 350 198 328 198 294 C 198 222 210 156 256 106 Z
         M226 202 a30 30 0 1 0 60 0 a30 30 0 1 0 -60 0 Z"/>
  </g>
</svg>

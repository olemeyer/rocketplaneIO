<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1000px;
        background: #0a0e14;
        background-image:
          radial-gradient(46% 40% at 18% 12%, rgba(45, 212, 191, 0.14), transparent 70%),
          radial-gradient(40% 34% at 82% 20%, rgba(129, 140, 248, 0.14), transparent 72%);
        color: #e9eef5;
        font-family: 'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif;
        padding: 56px;
      }
      .mono { font-family: 'Geist Mono', ui-monospace, monospace; }

      /* Lockup */
      .lockup { display: flex; align-items: center; gap: 20px; }
      .lockup img { width: 84px; height: 84px; }
      .lockup .word { font-size: 46px; font-weight: 600; letter-spacing: -0.03em; }
      .lockup .word b { font-weight: 700; }
      .tagline { color: #8a96a7; font-size: 14px; margin: 14px 0 40px 104px; }

      .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #515c6b; margin-bottom: 16px; }

      .row { display: flex; align-items: flex-end; gap: 30px; }
      .swatch { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .swatch .sz { font-size: 11px; color: #55606f; }

      .panel { border: 1px solid #1c2531; border-radius: 18px; padding: 34px; margin-top: 14px; }
      .panel.dark { background: #0e131b; }
      .panel.light { background: #f7f9fb; border-color: #e2e8f0; }
      .panel.light .sz { color: #8a96a7; }

      .mono-badge { display: grid; place-items: center; width: 88px; height: 88px; border-radius: 16px;
        background: #0e131b; border: 1px solid #1c2531; color: #e9eef5; }
      .mono-badge.inv { background: #f7f9fb; border-color: #e2e8f0; color: #0a0e14; }

      section { margin-top: 46px; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    </style>
  </head>
  <body>
    <div class="lockup">
      <img src="icon-trace.svg" alt="rocketplane" />
      <div class="word">rocket<b>plane</b></div>
    </div>
    <div class="tagline mono">observability at the speed of thought</div>

    <div class="label">App icon · scales from tile to 16px favicon</div>
    <div class="panel dark">
      <div class="row">
        <div class="swatch"><img src="icon-trace.svg" width="96" height="96" /><span class="sz">96</span></div>
        <div class="swatch"><img src="icon-trace.svg" width="64" height="64" /><span class="sz">64</span></div>
        <div class="swatch"><img src="icon-trace.svg" width="48" height="48" /><span class="sz">48</span></div>
        <div class="swatch"><img src="icon-trace.svg" width="32" height="32" /><span class="sz">32</span></div>
        <div class="swatch"><img src="icon-trace.svg" width="20" height="20" /><span class="sz">20</span></div>
        <div class="swatch"><img src="icon-trace.svg" width="16" height="16" /><span class="sz">16 · favicon</span></div>
      </div>
    </div>

    <section class="cols">
      <div>
        <div class="label">On light</div>
        <div class="panel light">
          <div class="row">
            <div class="swatch"><img src="icon-trace.svg" width="64" height="64" /><span class="sz">64</span></div>
            <div class="swatch"><img src="icon-trace.svg" width="40" height="40" /><span class="sz">40</span></div>
            <div class="swatch"><img src="icon-trace.svg" width="24" height="24" /><span class="sz">24</span></div>
          </div>
        </div>
      </div>
      <div>
        <div class="label">Monochrome line</div>
        <div class="panel dark" style="display:flex; gap:20px; align-items:center;">
          <div class="mono-badge">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M4.5 18 C 8 17 10 12.5 12.5 10 C 14.3 8.2 15.8 7 17 6" />
              <circle cx="4.5" cy="18" r="1.4" fill="currentColor" stroke="none" />
              <circle cx="17" cy="6" r="2.4" fill="currentColor" stroke="none" />
            </svg>
          </div>
          <div class="mono-badge inv">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M4.5 18 C 8 17 10 12.5 12.5 10 C 14.3 8.2 15.8 7 17 6" />
              <circle cx="4.5" cy="18" r="1.4" fill="currentColor" stroke="none" />
              <circle cx="17" cy="6" r="2.4" fill="currentColor" stroke="none" />
            </svg>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
